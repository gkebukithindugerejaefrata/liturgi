<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liturgi Ibadah</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style id="css">
:root{--bg:#f7f5f0;--card:#fff;--tx:#1f2430;--mut:#6b7280;--pri:#5b3fa0;--pri2:#ece6fa;--bd:#e4e0d8;--dng:#c0392b;--r1:#2e6bd6;--r2:#b45309;--r3:#0f766e;--r4:#7c2d92;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1f232b;--tx:#eceef2;--mut:#9aa1ad;--pri:#a78bfa;--pri2:#2b2540;--bd:#2f3541;--dng:#f87171;--r1:#7ab0ff;--r2:#fbbf6a;--r3:#5eead4;--r4:#e0a6f2}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1f232b;--tx:#eceef2;--mut:#9aa1ad;--pri:#a78bfa;--pri2:#2b2540;--bd:#2f3541;--dng:#f87171;--r1:#7ab0ff;--r2:#fbbf6a;--r3:#5eead4;--r4:#e0a6f2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{font-size:calc(16px*var(--fs,1))}body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0;flex:1}main{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.seg{display:flex;background:var(--pri2);border-radius:10px;padding:3px}.seg button{border:0;background:none;color:var(--tx);padding:6px 14px;border-radius:8px;font:inherit;font-size:14px}.seg .on{background:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.item{cursor:pointer}.item h3{margin:0 0 4px;font-size:17px}.mut{color:var(--mut);font-size:.875rem}.tg{display:flex;gap:6px}.tg button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 10px;font-size:.8125rem}h1{font-size:1.2rem}
button{font:inherit;cursor:pointer}.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px}.btn.o{background:none;color:var(--pri);border:1px solid var(--pri)}.btn.d{background:none;color:var(--dng);border:1px solid var(--dng)}.btn.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.acts{margin-top:10px}
.ic{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;width:34px;height:34px}.ic.dng{color:var(--dng)}
.pt{scroll-margin-top:80px}.pt.card{padding:12px 14px;margin-bottom:10px}.pt.card+.pt.card{margin-top:0}
.hero-banner{position:relative;width:100%;max-width:851px;margin:0 auto 14px;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--bd);aspect-ratio:851/315;display:flex;align-items:center;justify-content:center;}
.hero-banner img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block;border-radius:14px;margin:0 auto}
.hero-banner.cover img{width:100%;height:100%;object-fit:cover}

.hero-banner .placeholder{width:100%;height:100%;min-height:200px;display:grid;place-items:center;color:var(--mut);font-size:14px;background:linear-gradient(135deg,var(--pri2),var(--bg));border-radius:14px}
.item-hero{height:100%;width:auto;max-width:100%;max-height:315px;object-fit:contain;display:block;margin:0 auto;border-radius:14px 14px 0 0}
.card.item{padding-top:0;overflow:hidden}
.liturgy-card{display:flex;flex-direction:column;overflow:hidden;padding:0 !important;border-radius:14px}
.liturgy-card-image{position:relative;width:100%;aspect-ratio:851/315;overflow:hidden;background:var(--card);border-bottom:1px solid var(--bd);display:block}
.liturgy-card-image.global-style{aspect-ratio:851/315;max-width:100%;box-shadow:none;border-radius:14px 14px 0 0}
.liturgy-card-image .item-hero{width:100%;height:100%;object-fit:cover;display:block;border-radius:14px 14px 0 0;margin:0}
.liturgy-card-image .liturgy-card-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.25));pointer-events:none;border-radius:14px 14px 0 0}
.liturgy-card-info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.liturgy-card-info .liturgy-title{margin:0 0 4px;font-size:17px;font-weight:700;line-height:1.35}
.liturgy-card-info .liturgy-meta{display:flex;flex-direction:row;gap:8px;flex:1;flex-wrap:wrap;align-items:center}
.liturgy-card-info .liturgy-meta .mut{font-size:13px;line-height:1.4;white-space:nowrap}
.liturgy-card-info .liturgy-bottom-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.liturgy-card-info .liturgy-share{display:flex;gap:6px;align-items:center;flex-shrink:0}
.liturgy-card-info .acts{margin-top:8px}
@media(max-width:380px){.liturgy-card-info .liturgy-bottom-row{flex-direction:column;align-items:flex-start}}

.liturgy-card{display:flex;flex-direction:column;overflow:hidden;padding:0 !important;border-radius:14px}
.liturgy-card-image{position:relative;width:100%;aspect-ratio:851/315;overflow:hidden;background:var(--card);border-bottom:1px solid var(--bd);display:block}
.liturgy-card-image.global-style{aspect-ratio:851/315;max-width:100%;box-shadow:none;border-radius:14px 14px 0 0}
.liturgy-card-image .item-hero{width:100%;height:100%;object-fit:cover;display:block;border-radius:14px 14px 0 0;margin:0}
.liturgy-card-image .liturgy-card-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.25));pointer-events:none;border-radius:14px 14px 0 0}
.liturgy-card-info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.liturgy-card-info .liturgy-title{margin:0 0 4px;font-size:17px;font-weight:700;line-height:1.35}
.liturgy-card-info .liturgy-meta{display:flex;flex-direction:row;gap:8px;flex:1;flex-wrap:wrap;align-items:center}
.liturgy-card-info .liturgy-meta .mut{font-size:13px;line-height:1.4;white-space:nowrap}
.liturgy-card-info .liturgy-bottom-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.liturgy-card-info .liturgy-share{display:flex;gap:6px;align-items:center;flex-shrink:0}
.liturgy-card-info .acts{margin-top:8px}
@media(max-width:380px){.liturgy-card-info .liturgy-bottom-row{flex-direction:column;align-items:flex-start}}


.global-hero{margin-bottom:18px;box-shadow:0 4px 16px rgba(0,0,0,.12);border-radius:14px;display:block;overflow:hidden;aspect-ratio:851/315;position:relative;width:100%;max-width:851px;background:var(--card);border:1px solid var(--bd)}
.global-hero img{width:100%;height:100%;object-fit:cover;display:block;border-radius:14px}
.global-hero .overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.35));pointer-events:none;border-radius:14px}


#splash{position:fixed;inset:0;background:rgba(255,255,255,0.85);backdrop-filter:blur(2px);z-index:9999;display:grid;place-items:center;transition:opacity .6s ease}
#splash.hide{opacity:0;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}

.hd{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:.875rem;line-height:1}
.ht{flex:1;min-width:0}.t{font-weight:600;line-height:1.35}.tag{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--pri);font-weight:700;line-height:1.2}
.bd{padding:2px 0 8px 44px}.bd.lt{padding-left:0}.bd.lt .nt{margin-left:0;width:100%}.bd .nt{margin-left:-44px;width:calc(100% + 44px)}
.pt.done .n{background:var(--r3);color:var(--bg)}.pt.done .t{text-decoration:line-through;opacity:.6}.pt.done .bd{opacity:.5}
.prog{display:flex;align-items:center;gap:8px;margin-bottom:12px}.prog span{flex:1;font-size:.875rem;color:var(--mut)}
.d{margin:4px 0 0;white-space:pre-wrap;color:var(--mut)}
.ln{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:9px 0;white-space:pre-wrap}.ln+.ln{border-top:1px solid var(--bd)}.ln span{align-self:stretch;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.ln b{flex:none;min-width:84px;text-align:center;font-size:.75rem;letter-spacing:.03em;padding:3px 10px;border-radius:999px;border:1px solid var(--c);color:var(--c);background:var(--pri2);background:color-mix(in srgb,var(--c) 14%,transparent);margin-top:1px}
.ln.r-Pendeta{--c:var(--r1)}.ln.r-Liturgos{--c:var(--r2)}.ln.r-Jemaat{--c:var(--r3)}.ln.r-Bersama{--c:var(--r4)}.ln.r-Custom{--c:var(--mut)}
.ln.r-Bersama b{background:var(--r4);color:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.2)}.ln.r-Bersama span{font-weight:700}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px}textarea{min-height:64px;resize:vertical}
.rtl{margin-top:8px;font-size:.9rem}.rtb{display:flex;gap:4px;margin:4px 0}.rtb .ic{min-width:30px;height:28px;padding:0 6px}.rte{min-height:64px;border:1px solid var(--bd);border-radius:10px;padding:9px 10px;background:var(--bg);color:var(--tx);outline:none;overflow-wrap:anywhere}.rte:focus{border-color:var(--pri)}.rte:empty:before{content:attr(data-ph);color:var(--mut)}
.cue{text-align:right;font-weight:700;font-style:italic;font-size:.82rem;margin:0 4px 8px}
.line{display:grid;grid-template-columns:96px 1fr 34px;gap:6px;margin-top:6px;align-items:start}
.add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);display:flex;gap:8px;max-width:640px;margin:0 auto}.bar .btn{flex:1}
.nt{width:100%;margin-top:8px;border-radius:8px;border:1px solid var(--bd);background:#fff;cursor:zoom-in;display:block}.ly{color:var(--tx);margin-top:10px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.thumb{position:relative;margin:10px 0}.thumb img{width:100%;max-height:220px;object-fit:contain;background:#fff;border:1px solid var(--bd);border-radius:8px;display:block}.thumb button{position:static;margin-top:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);overflow:auto;z-index:20}.ov img{width:100%;background:#fff;display:block;margin-top:56px}.ov.z img{width:250%;max-width:none}.ov .btn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:21}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;display:none}

/* UPDATE 1-4 */
.liturgy-title{white-space:pre-wrap!important;word-break:break-word;overflow-wrap:anywhere;line-height:1.35!important}
.detail-judul{white-space:pre-wrap!important;word-break:break-word;line-height:1.35!important}
.waktu-ibadah{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 2px;padding:7px 10px;background:var(--pri2);border-radius:10px;border:1px solid var(--bd)}
.jam-pill-front{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.order-controls{display:flex;gap:4px;align-items:center;margin-top:8px;flex-wrap:wrap}
.order-index{min-width:28px;height:28px;display:grid;place-items:center;background:var(--pri2);color:var(--pri);border-radius:8px;font-size:12px;font-weight:700}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.confirm-box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;max-width:400px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.confirm-box h3{margin:0 0 8px;font-size:18px}
.confirm-box p{margin:0 0 18px;color:var(--mut);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end}
.textarea-judul{min-height:90px;resize:vertical;line-height:1.45}

/* ===== Teks kaya (bold / italic / underline) — disimpan sebagai penanda [b][i][u] di dalam teks biasa ===== */
function rtxt(v){v=String(v==null?'':v);let out='',st=[];
  v.split(/(\[\/?[biu]\])/).forEach(t=>{const m=/^\[(\/?)([biu])\]$/.exec(t);
    if(!m){out+=esc(t);return}
    const T={b:'strong',i:'em',u:'u'}[m[2]];
    if(!m[1]){st.push(m[2]);out+='<'+T+'>';return}
    const k=st.lastIndexOf(m[2]);if(k<0)return;
    while(st.length>k+1){out+='</'+{b:'strong',i:'em',u:'u'}[st.pop()]+'>'}
    st.pop();out+='</'+T+'>'});
  while(st.length){out+='</'+{b:'strong',i:'em',u:'u'}[st.pop()]+'>'}
  return out}
function rtHtml(v){return rtxt(v).replace(/\n/g,'<br>')}
const RT_SKIP=new Set(['STYLE','SCRIPT','META','LINK','TITLE','HEAD','XML','NOSCRIPT','TEMPLATE']);
const RT_BLK=new Set(['DIV','P','LI','UL','OL','H1','H2','H3','H4','H5','H6','BLOCKQUOTE','TR','TABLE','PRE','SECTION','ARTICLE']);
function rtTok(root){
  let out='';
  const nl=()=>{if(out&&!out.endsWith('\n'))out+='\n'};
  const walk=n=>{
    if(n.nodeType==3){let t=n.nodeValue.replace(/[ \t\r\n]+/g,' ').replace(/\u00a0/g,' ');if(!out||out.endsWith('\n'))t=t.replace(/^ +/,'');out+=t;return}
    if(n.nodeType!=1||RT_SKIP.has(n.tagName))return;
    const tg=n.tagName;
    if(tg=='BR'){out+='\n';return}
    const blk=RT_BLK.has(tg),st=n.style||{};
    let b=tg=='B'||tg=='STRONG',i=tg=='I'||tg=='EM',u=tg=='U';
    const fw=st.fontWeight,fs=st.fontStyle,td=(st.textDecorationLine||st.textDecoration||'');
    if(fw){if(fw=='bold'||fw=='bolder'||+fw>=600)b=true;else if(fw=='normal'||(+fw>0&&+fw<=500))b=false}
    if(fs){if(fs=='italic'||fs=='oblique')i=true;else if(fs=='normal')i=false}
    if(td){if(td.indexOf('underline')>=0)u=true;else if(td=='none')u=false}
    if(blk)nl();
    if(b)out+='[b]';if(i)out+='[i]';if(u)out+='[u]';
    const mark=out.length,kids=[...n.childNodes];
    if(blk&&kids.length&&kids[kids.length-1].nodeName=='BR')kids.pop();
    kids.forEach(walk);
    if(u)out+='[/u]';if(i)out+='[/i]';if(b)out+='[/b]';
    if(blk&&!(out.length>mark&&out.endsWith('\n')))out+='\n'};
  [...root.childNodes].forEach(walk);
  return out.replace(/\[\/([biu])\]\[\1\]/g,'').replace(/\[([biu])\]\[\/\1\]/g,'').replace(/ +\n/g,'\n').replace(/\n$/,'')}

function packLampiran(ifr,doc,g){
  try{
    const grid=doc.querySelector('.lagu-grid');if(!grid)return;
    const cards=[...grid.children].filter(e=>e.classList.contains('lagu-mini-card'));
    if(cards.length<3)return;
    const mm=96/25.4,pw=(g.w-g.ml-g.mr)*mm,ph=(g.h-g.mt-g.mb)*mm;
    const ow=ifr.style.width,oh=ifr.style.height,oa=grid.style.alignItems;
    ifr.style.width=pw+'px';ifr.style.height=Math.ceil(ph)+'px';grid.style.alignItems='start';
    const hs=cards.map(c=>c.getBoundingClientRect().height);
    grid.style.alignItems=oa;ifr.style.width=ow;ifr.style.height=oh;
    const gap=10*96/72,frag=doc.createDocumentFragment();
    let run=[];
    const flush=()=>{if(!run.length)return;
      const wrap=doc.createElement('div');wrap.className='lagu-cols';
      const cols=[0,1].map(()=>{const c=doc.createElement('div');c.className='lagu-col';wrap.appendChild(c);return c});
      const hh=[0,0];
      run.forEach(o=>{const k=hh[0]<=hh[1]?0:1;cols[k].appendChild(o.c);hh[k]+=o.h+gap});
      frag.appendChild(wrap);run=[]};
    cards.forEach((c,i)=>{if(c.classList.contains('side')){flush();c.style.marginBottom='10pt';frag.appendChild(c)}else run.push({c:c,h:hs[i]})});
    flush();
    grid.textContent='';grid.appendChild(frag);grid.style.display='block';
  }catch(e){console.error(e)}
}
function fitLampiran(ifr,doc,g){
  try{
    const ap=doc.querySelector('.lagu-appendix'),ct=doc.querySelector('.content');
    if(!ap||!ct)return;
    const mm=96/25.4,pw=(g.w-g.ml-g.mr)*mm,ph=(g.h-g.mt-g.mb)*mm;
    const ow=ifr.style.width,oh=ifr.style.height;
    ifr.style.width=pw+'px';ifr.style.height=Math.ceil(ph*3)+'px';
    const end=ct.getBoundingClientRect().bottom+(doc.defaultView.scrollY||0);
    ifr.style.width=ow;ifr.style.height=oh;
    let rem=end%ph;if(rem<1&&end>1)rem=ph;
    const used=(g.mt*mm+rem)/(g.h*mm);
    if(used>0.5){ap.style.breakBefore='page';ap.style.pageBreakBefore='always';ap.style.marginTop='0';ap.style.paddingTop='0';ap.style.borderTop='0'}
    return used;
  }catch(e){console.error(e)}
}
function openF4Pdf(){
  if(window._pdfLock){ toast('PDF sedang diproses...'); return; }
  window._pdfLock=true;
  const x=D.liturgies.find(y=>y.id==S.id); if(!x){ window._pdfLock=false; return; }
  let html=buildF4Html(x);
  html = html.replace(/<script>window\.onload[\s\S]*?<\/script>/gi, '');
  const safeTitle = ((x.judul||'Liturgi')+' - F4 11pt').trim().replace(/[<>]/g,'').slice(0,120);
  html = html.replace(/<title>.*?<\/title>/i, '<title>'+safeTitle.replace(/"/g,'')+'</title>');
  let ifr=document.getElementById('pdf-ifr'); if(ifr) ifr.remove();
  ifr=document.createElement('iframe'); ifr.id='pdf-ifr';
  ifr.style.position='fixed'; ifr.style.left='-9999px'; ifr.style.top='0';
  ifr.style.width='0'; ifr.style.height='0'; ifr.style.border='0';
  document.body.appendChild(ifr);
  const doc=ifr.contentDocument||ifr.contentWindow.document;
  doc.open();doc.write(html);doc.close();
  const origParentTitle = document.title;
  try{ doc.title = safeTitle; }catch(e){}
  try{ document.title = safeTitle; }catch(e){}
  let done=false;
  const doPrint=()=>{
    if(done) return; done=true;
    try{ doc.title = safeTitle; }catch(e){}
    try{ ifr.contentWindow.document.title = safeTitle; }catch(e){}
    try{ document.title = safeTitle; }catch(e){}
    packLampiran(ifr,doc,{w:215,h:330,mt:10,mb:10,ml:10,mr:10});
    fitLampiran(ifr,doc,{w:215,h:330,mt:10,mb:10,ml:10,mr:10});
    try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); }catch(e){ console.error(e); }
    setTimeout(()=>{ try{ document.title = origParentTitle; }catch(e){} window._pdfLock=false; try{ifr.remove();}catch(e){} }, 2000);
  };
  ifr.onload=()=>{ setTimeout(doPrint, 800); };
  setTimeout(()=>{ if(!done) doPrint(); }, 2000);
}

function getShareUrl(id){
  try{
    const url = new URL(window.location.href);
    url.searchParams.set('id', id);
    return url.toString();
  }catch(e){
    return window.location.origin + window.location.pathname + '?id=' + encodeURIComponent(id);
  }
}
function shareToWA(id, judul){
  const url = getShareUrl(id);
  const text = (judul ? judul + ' - Liturgi Ibadah\n' : '') + url;
  const waUrl = 'https://wa.me/?text=' + encodeURIComponent(text);
  window.open(waUrl, '_blank');
}
function copyShareLink(id){
  const url = getShareUrl(id);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>toast('Link disalin: '+url)).catch(()=>{ prompt('Copy link manual:', url); });
  }else{
    prompt('Copy link manual:', url);
  }
}
function nativeShare(id, judul){
  const url = getShareUrl(id);
  if(navigator.share){
    navigator.share({title: judul||'Liturgi Ibadah', text: judul||'Liturgi Ibadah', url: url}).catch(()=>{});
  }else{
    shareToWA(id, judul);
  }
}

function ensureOrders(){
  try{
    let max=-1;
    D.liturgies.forEach(l=>{ if(typeof l.order==='number' && l.order>max) max=l.order; });
    let need=false;
    D.liturgies.forEach(l=>{ if(l.order==null) need=true; });
    if(need){
      const sorted=[...D.liturgies].sort((a,b)=>{
        if(a.order!=null && b.order!=null) return a.order-b.order;
        if(a.order!=null) return -1;
        if(b.order!=null) return 1;
        return (a.tanggal||'').localeCompare(b.tanggal||'');
      });
      sorted.forEach(l=>{ if(l.order==null) l.order=++max; });
      [...D.liturgies].sort((a,b)=>a.order-b.order).forEach((l,i)=> l.order=i);
    }
  }catch(e){ console.error('ensureOrders',e); }
}
function getSortedLiturgies(){
  return [...D.liturgies].sort((a,b)=>{
    const ao=a.order!=null?a.order:999999;
    const bo=b.order!=null?b.order:999999;
    if(ao!==bo) return ao-bo;
    return (a.tanggal||'').localeCompare(b.tanggal||'');
  });
}
let _pendingDelId=null;

  const x=D.liturgies.find(y=>y.id==id);

  const msg=document.getElementById('confirmDelMsg');
  if(msg){
    const j=(x&&x.judul)||'Tanpa Judul';
    const pendek=j.length>120?j.slice(0,120)+'…':j;
    msg.textContent='Yakin hapus "'+pendek+'"? Tindakan tidak dapat dibatalkan.';
  }
  if(ov) ov.style.display='flex';
}
function hideDeleteConfirm(){
  _pendingDelId=null;
  const ov=document.getElementById('confirmDelOverlay');
  if(ov) ov.style.display='none';
}
async function confirmDelete(){
  if(!_pendingDelId) return;
  const id=_pendingDelId;
  hideDeleteConfirm();
  D.liturgies=D.liturgies.filter(y=>y.id!=id);
  getSortedLiturgies().forEach((l,i)=> l.order=i);
  return persist(null,id);
}
function moveLiturgy(id,dir){
  const L=getSortedLiturgies();
  const idx=L.findIndex(x=>x.id===id);
  if(idx<0) return;
  const nIdx=idx+dir;
  if(nIdx<0||nIdx>=L.length) return;
  const a=L[idx], b=L[nIdx];
  const ao=a.order, bo=b.order;
  a.order=bo; b.order=ao;
  if(a.order==null||b.order==null){
    L.forEach((l,i)=> l.order=i);
  }
  persist(a);
  setTimeout(()=>persist(b),200);
  toast(dir<0?'Dipindah ke atas':'Dipindah ke bawah');
  render();
}

      }
      h+='</div></div>';
    });
  }else if(S.view=='detail'){
    const x=D.liturgies.find(y=>y.id==S.id);
    if(x){
      h+='<div class="row" style="margin-bottom:10px"><button class="btn o sm" data-a="back">← Kembali</button><span class="sp"></span></div>'

      // HEADER IMAGE PER LITURGI - beda liturgi beda image
      if(x.headerImg){
        h+='<div class="hero-banner" style="margin-bottom:12px"><img src="'+esc(x.headerImg)+'" alt="Header '+esc(x.judul)+'" style="width:100%;height:100%;object-fit:cover"></div>';
      } else if(x.banner){
        h+='<div class="hero-banner" style="margin-bottom:12px"><img src="'+esc(x.banner)+'" alt="Header '+esc(x.judul)+'" style="width:100%;height:100%;object-fit:cover"></div>';
      }
      h+='<div class="card" style="margin-top:2px"><h2 class="detail-judul" style="margin:0 0 6px">'+esc(x.judul)+'</h2>'+renderJamPills(x)+'<div class="mut" style="line-height:1.2;margin-top:6px">'+meta(x)+'</div></div>';
      h+='<div class="prog"><span id="prog"></span><button class="btn o sm" data-a="next">↓ Lanjut</button><button class="btn o sm" data-a="rstdn">Reset</button></div>';
      h+='<div class="list-pt">'+x.points.map(pt).join('')+(x.points.length?'':'<div class="card"><p class="mut">Belum ada point.</p></div>')+'</div>';
    }
  }else{
    const e=S.edit;
    h+='<div class="card"><label>Nama liturgi (judul ibadah) - Enter untuk baris baru<textarea class="textarea-judul" data-f="judul" rows="3" placeholder="Judul, Enter untuk baris baru">'+esc(e.judul)+'</textarea></label><label>Hari dan tanggal<input type="date" data-f="tanggal" value="'+esc(e.tanggal)+'"></label><label>Jam ibadah (pisahkan koma jika lebih dari satu)<input data-f="jam" value="'+esc(e.jam)+'" placeholder="06.00, 08.30"></label><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px"><label>Nas bacaan<input data-f="nasBacaan" value="'+esc(e.nasBacaan)+'"></label><label>Nas khotbah<input data-f="nasKhotbah" value="'+esc(e.nasKhotbah)+'"></label></div><label>Tema<input data-f="tema" value="'+esc(e.tema)+'"></label></div>';
    // HEADER IMAGE PER LITURGI - upload manual beda per liturgi
    h+='<div class="card"><div class="tag" style="margin-bottom:8px">Header Image Liturgi (beda per liturgi - pemanis di tampilan ibadah)</div>';
    if(e.headerImg){
      h+='<div class="thumb" style="margin-bottom:10px"><img src="'+esc(e.headerImg)+'" alt="Header" style="max-height:220px;object-fit:contain"></div>';
    }
    h+='<div class="row" style="margin-top:8px"><button class="btn o sm" data-a="upheader">📷 '+(e.headerImg?'Ganti Header Image':'Upload Header Image')+'</button>'+(e.headerImg?'<button class="btn d sm" data-a="rmheader">Hapus Header</button>':'')+'</div><div class="mut" style="margin-top:8px">Gambar ini hanya untuk liturgi ini saja (851x315, height 100% width auto), tampil di atas detail ibadah dan di list awal</div></div>';
    h+=e.points.map(edPt).join('');
    h+='<div class="card"><div class="tag" style="margin-bottom:8px">Tambah point</div><div class="add"><button class="btn o" data-a="add" data-t="point">Point saja</button><button class="btn o" data-a="add" data-t="lagu">Lagu (menyanyi)</button><button class="btn o" data-a="add" data-t="litani">Litani</button><button class="btn o" data-a="add" data-t="desk">Point + Deskripsi</button></div><div class="tag" style="margin:12px 0 6px">Instruksi jemaat (tanpa nomor, rata kanan di PDF)</div><div class="add"><button class="btn o" data-a="add" data-t="cue" data-title="Jemaat berdiri">Jemaat berdiri</button><button class="btn o" data-a="add" data-t="cue" data-title="Jemaat duduk">Jemaat duduk</button><button class="btn o" data-a="add" data-t="cue" data-title="Ungkup mendeng">Ungkup mendeng</button><button class="btn o" data-a="add" data-t="cue" data-title="Ungkup mondok haluli">Ungkup mondok haluli</button><button class="btn o" data-a="add" data-t="cue" data-title="Ungkup mindri">Ungkup mindri</button><button class="btn o" data-a="add" data-t="cue" data-title="Ungkup maharung">Ungkup maharung</button><button class="btn o" data-a="add" data-t="cue" data-title="">Teks bebas</button></div></div>';
    h+='<div class="bar"><button class="btn o" data-a="cancel">Batal</button><button class="btn" data-a="save">Simpan</button></div>';
  }
  if(S.view=='detail')setTimeout(upProg,0);
  $('app').innerHTML=h+'</main>'+(S.zoom?'<div class="ov"><button class="btn sm" data-a="closeov">Tutup ✕</button><img data-a="zoomtog" src="'+esc(S.zoom)+'" alt=""></div>':'');
}
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset.f;if(!f||!S.edit)return;
  if(t.dataset.i==null)S.edit[f]=t.value;
  else{const p=S.edit.points[t.dataset.i];if(t.dataset.l!=null){if(f=='who'&&t.value=='__custom'){p.lines[t.dataset.l].who='Petugas';render();return}p.lines[t.dataset.l][f]=t.value;if(f=='who'&&t.tagName=='SELECT')render()}else{if(f=='label'&&t.tagName=='SELECT'){p.label=t.value=='__custom'?'Menyanyikan lagu':t.value;render();return}p[f]=t.value}}
});
document.addEventListener('change',e=>{if(e.target.id=='notasiMode'){NOTASI=e.target.value=='bawah'?'bawah':'auto';try{localStorage.setItem('notasiMode',NOTASI)}catch(_){}}});
document.addEventListener('input',e=>{const el=e.target&&e.target.closest?e.target.closest('[data-rt]'):null;if(el)syncRt(el)});
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('[data-a=fmt]'))e.preventDefault()});
document.addEventListener('paste',e=>{const el=e.target&&e.target.closest?e.target.closest('[data-rt]'):null;if(!el)return;e.preventDefault();
  const cd=e.clipboardData,h=cd.getData('text/html');let tok;
  if(h)tok=rtTok(new DOMParser().parseFromString(h,'text/html').body);else tok=cd.getData('text/plain').replace(/\r\n?/g,'\n').replace(/\n$/,'');
  document.execCommand('insertHTML',false,rtHtml(tok));syncRt(el)});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,i=+b.dataset.i,E=S.edit;
  if(['new','edit','dup','del','save','add','up','dn','rm','addl','rml','chpin','exp','imp','upimg','rmimg'].includes(a)&&!(S.admin&&S.un))return;
  if(a=='fmt'){document.execCommand(b.dataset.cmd,false,null);const ae=document.activeElement,ed=ae&&ae.closest?ae.closest('[data-rt]'):null;if(ed)syncRt(ed);return}
  if(a=='unlock')return doLogin();
  if(a=='open'&&!e.target.closest('button')){S.view='detail';S.id=id;S.dn=ld(id); updateUrlForId(id);}
  else if(a=='exp'){const bl=new Blob([JSON.stringify({liturgies:D.liturgies},null,1)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='liturgi-backup.json';l.click();return}
  else if(a=='imp'){
  const f=document.createElement('input');f.type='file';f.accept='.json';
  f.onchange=()=>{
    const fl=f.files[0];if(!fl)return;
    fl.text().then(t=>{
      try{
        const j=JSON.parse(t);
        if(!Array.isArray(j.liturgies)) throw 0;
        const hasExisting=D.liturgies.length>0;
        let doMerge=true;
        if(hasExisting){
          doMerge=confirm('File berisi '+j.liturgies.length+' liturgi.\nOK = GABUNGKAN (aman)\nCancel = GANTI SEMUA');
          if(!doMerge){
            if(!confirm('YAKIN GANTI SEMUA?')) return;
            D.liturgies=j.liturgies;
            D.liturgies.forEach((l,i)=>{ if(l.order==null) l.order=i; });
            j.liturgies.forEach(x=>persist(x));
            toast('Import: menggantikan '+j.liturgies.length);
            render(); return;
          }
        }
        const ids=new Set(D.liturgies.map(y=>y.id));
        let added=0;
        j.liturgies.forEach(x=>{
          if(!x||!x.judul) return;
          if(!x.id||ids.has(x.id)){ x.id=uid(); if(x.points) x.points.forEach(p=>p.id=uid()); }
          if(x.order==null) x.order=Math.max(-1,...D.liturgies.map(l=>l.order!=null?l.order:-1))+1;
          D.liturgies.push(x); ids.add(x.id); persist(x); added++;
        });
        toast('Import: '+added+' ditambahkan');
        render();
      }catch(e){ toast('File tidak valid'); console.error(e); }
    });
  }; f.click();return
}
  else if(a=='mark'){const pid=b.dataset.pid,k=S.dn.indexOf(pid),d=k<0;d?S.dn.push(pid):S.dn.splice(k,1);sv(S.id,S.dn);b.closest('.pt').classList.toggle('done',d);b.querySelector('.n').textContent=d?'✓':b.dataset.n;upProg();return}
  else if(a=='rstdn'){S.dn=[];sv(S.id,S.dn)}
  else if(a=='pdff4'){openF4Pdf();return}
  else if(a=='pdff4super'){openF4HalfSuperMepetPdf();return}
  else if(a=='next'){const el=document.querySelector('.pt:not(.done)');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});else toast('Semua point sudah selesai');return}
  else if(a=='zoom'){S.zoom=b.getAttribute('src')}
  else if(a=='zoomtog'){document.querySelector('.ov').classList.toggle('z');return}
  else if(a=='closeov'){S.zoom=null}
  else if(a=='rmimg'){E.points[i].imgs.splice(+b.dataset.l,1)}
  else if(a=='upimg'){const f=document.createElement('input');f.type='file';f.accept='image/*';f.multiple=true;f.onchange=async()=>{const p=E.points[i];p.imgs=p.imgs||[];toast('Mengunggah gambar...');for(const fl of f.files){try{p.imgs.push(await upl(fl))}catch(e){toast('Gagal unggah: '+(e.message||'gambar'))}}render()};f.click();return}
  else if(a=='lock'){if(sb)sb.auth.signOut();S.un=false;S.view='list';S.tab='jemaat';ss('lt',null)}
  else if(a=='theme'){P.th=P.th=='auto'?'light':P.th=='light'?'dark':'auto';applyP()}
  else if(a=='fs'){P.fs=Math.min(1.4,Math.max(.85,+(P.fs+(+b.dataset.v)).toFixed(2)));applyP()}
  else if(a=='tab'){S.tab=b.dataset.v;S.cf=null;S.chg=false;ss('lt',S.tab)}
  else if(a=='back'){S.view='list'; clearUrlId();}
  else if(a=='sharewa'){const x=D.liturgies.find(y=>y.id==S.id); if(x) shareToWA(x.id, x.judul); return}
  else if(a=='sharecopy'){const x=D.liturgies.find(y=>y.id==S.id); if(x) copyShareLink(x.id); return}
  else if(a=='sharenative'){const x=D.liturgies.find(y=>y.id==S.id); if(x) nativeShare(x.id, x.judul); return}
  else if(a=='sharelistwa'){const x=D.liturgies.find(y=>y.id==id); if(x){ shareToWA(x.id, x.judul); } return}
  else if(a=='sharelistcopy'){const x=D.liturgies.find(y=>y.id==id); if(x){ copyShareLink(x.id); } return}
  else if(a=='new'){const maxO=Math.max(-1,...D.liturgies.map(l=>l.order!=null?l.order:-1)); S.edit={id:uid(),judul:'',jam:'',tanggal:new Date().toISOString().slice(0,10),nasBacaan:'',nasKhotbah:'',tema:'',points:[],headerImg:null,order:maxO+1};S.view='edit'}
  else if(a=='edit'){S.edit=JSON.parse(JSON.stringify(D.liturgies.find(y=>y.id==id)));S.view='edit'}
  else if(a=='dup'){const c=JSON.parse(JSON.stringify(D.liturgies.find(y=>y.id==id)));c.id=uid();c.judul+=' (Salinan)';c.points.forEach(p=>p.id=uid());c.order=Math.max(-1,...D.liturgies.map(l=>l.order!=null?l.order:-1))+1;D.liturgies.push(c);return persist(c)}
  else if(a=='del'){ showDeleteConfirm(id); return }
  else if(a=='ordup'){ moveLiturgy(id,-1); return }
  else if(a=='orddown'){ moveLiturgy(id,1); return }
  else if(a=='confirmdel'){ confirmDelete(); return }
  else if(a=='canceldel'){ hideDeleteConfirm(); return }
  else if(a=='cancel'){S.edit=null;S.view='list'}
  else if(a=='save'){
    if(!E.judul.trim()){toast('Nama liturgi wajib diisi');return}
    const k=D.liturgies.findIndex(y=>y.id==E.id);if(k<0)D.liturgies.push(E);else D.liturgies[k]=E;
    S.edit=null;S.view='list';return persist(E);
  }
  else if(a=='add'){const t=b.dataset.t,p={id:uid(),type:t,title:b.dataset.title||''};if(t=='litani')p.lines=[{who:'Pendeta',text:''}];E.points.push(p)}
  else if(a=='up'&&i>0){[E.points[i-1],E.points[i]]=[E.points[i],E.points[i-1]]}
  else if(a=='dn'&&i<E.points.length-1){[E.points[i+1],E.points[i]]=[E.points[i],E.points[i+1]]}
  else if(a=='rm'){E.points.splice(i,1)}
  else if(a=='addl'){const ls=E.points[i].lines;const last=ls[ls.length-1];ls.push({who:last&&last.who=='Pendeta'?'Jemaat':'Pendeta',text:''})}
  else if(a=='rml'){E.points[i].lines.splice(+b.dataset.l,1)}
  else if(a=='upheader'){
    const f=document.createElement('input'); f.type='file'; f.accept='image/*';
    f.onchange=async()=>{ const file=f.files[0]; if(!file) return; toast('Mengunggah header...'); try{ const url=await upl(file); E.headerImg=url; render(); toast('Header image disimpan'); }catch(err){ toast('Gagal upload: '+(err.message||'gambar')); } };
    f.click(); return;
  } else if(a=='rmheader'){
    E.headerImg=null; render(); return;
  } else if(a=='globalheroupload' || a=='globalherochange'){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=async()=>{ 
      const file=inp.files[0]; if(!file) return; toast('Mengunggah header awal 851x315...');
      try{
        const url=await upl(file);
        try{ localStorage.setItem('gke-global-header-img', url); sessionStorage.setItem('gke-global-header-img', url); }catch(e){}
        D.globalHeader=url; window.GLOBAL_HEADER_URL=url;
        if(sb){
          try{ await sb.from('liturgies').upsert({id:'__global_header__', data:{globalHeader:url, isGlobalHeader:true, id:'__global_header__'}, updated_at:new Date().toISOString()}); }catch(e){}
        }
        toast('Header awal tersimpan & tampil untuk semua jemaat');
        render();
      }catch(e){
        try{
          const blob=await cmp(file);
          const reader=new FileReader();
          reader.onload=()=>{ 
            try{ 
              localStorage.setItem('gke-global-header-img', reader.result); 
              D.globalHeader=reader.result; window.GLOBAL_HEADER_URL=reader.result;
              toast('Header awal disimpan lokal (Supabase gagal) - coba lagi nanti'); 
              render(); 
            }catch(err){ toast('Gagal simpan - gambar terlalu besar, coba <2MB'); } 
          };
          reader.readAsDataURL(blob);
        }catch(err){ toast('Gagal upload: '+(e.message||'gambar')); }
      }
    };
    inp.click(); return;
  } else if(a=='globalheroremove'){
    try{ localStorage.removeItem('gke-global-header-img'); sessionStorage.removeItem('gke-global-header-img'); }catch(e){}
    D.globalHeader=null; window.GLOBAL_HEADER_URL=null;
    if(sb){
      try{ await sb.from('liturgies').delete().eq('id','__global_header__'); }catch(e){}
    }
    toast('Header awal dihapus'); render();
    return;
  }
  render();
});

document.addEventListener('click',e=>{ const ov=document.getElementById('confirmDelOverlay'); if(ov&&e.target===ov) hideDeleteConfirm(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const ov=document.getElementById('confirmDelOverlay'); if(ov&&ov.style.display!=='none') hideDeleteConfirm(); } });

applyP();render();
// splash 2 detik putih transparan GKE BUKT HINDU kecil
setTimeout(()=>{ const s=document.getElementById('splash'); if(s){ s.classList.add('hide'); setTimeout(()=>{ s.remove(); },600); } },2000);
(async()=>{
  S.admin=true;if(sg('lt')=='admin')S.tab='admin';
  // SHARE LINK WA: parse ?id= dari URL untuk deep link
  try{
    const urlParams = new URLSearchParams(window.location.search);
    const shareId = urlParams.get('id');
    if(shareId){
      S._pendingShareId = shareId;
      S.view='detail'; S.id=shareId;
    }
  }catch(e){}

  if(!sb){render();toast('Isi URL dan anon key Supabase di file ini');return}
  const {data}=await sb.auth.getSession();S.un=!!data.session;
  sb.auth.onAuthStateChange((ev,ses)=>{const u=!!ses;if(u!=S.un){S.un=u;render()}});
  render();await loadAll();
  // Jika ada pending share id, coba buka setelah data loaded
  if(S._pendingShareId){
    const found = D.liturgies.find(y=>y.id==S._pendingShareId);
    if(found){
      S.view='detail'; S.id=found.id; S.dn=ld(found.id);
      render();
    }else{
      // coba tunggu sebentar lagi (supabase async)
      setTimeout(()=>{
        const f2 = D.liturgies.find(y=>y.id==S._pendingShareId);
        if(f2){ S.view='detail'; S.id=f2.id; S.dn=ld(f2.id); render(); }
      }, 1500);
    }
  }

  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view!='edit')loadAll()});
})();
